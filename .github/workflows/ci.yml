name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (zero runtime deps)
        run: pip install pytest

      - name: Test suite
        run: python -m pytest -v
