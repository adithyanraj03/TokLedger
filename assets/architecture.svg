<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#11151f"/>
    </linearGradient>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9fb4ff"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="url(#bg3)" rx="14"/>
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf5">Every Request Gets Priced</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#7a8194">one process, zero dependencies, no cloud — your local engine stays exactly where it is</text>

  <!-- clients -->
  <g>
    <rect x="50" y="110" width="150" height="56" rx="10" fill="#151b29" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="125" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#7dd3fc">your agent / app</text>
    <text x="125" y="152" text-anchor="middle" font-size="11" fill="#9aa2b5">OpenAI-compatible SDK</text>
  </g>
  <g>
    <rect x="50" y="186" width="150" height="56" rx="10" fill="#151b29" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="125" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#7dd3fc">notebooks, scripts</text>
    <text x="125" y="228" text-anchor="middle" font-size="11" fill="#9aa2b5">base_url swap, nothing else</text>
  </g>

  <!-- proxy (center, big) -->
  <g>
    <rect x="280" y="96" width="340" height="196" rx="14" fill="#131a2a" stroke="#4f8cff" stroke-width="2.2"/>
    <text x="450" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#e8ecf5">tokledger proxy</text>
    <text x="450" y="146" text-anchor="middle" font-size="11" fill="#7a8194">stdlib http.server · streaming SSE passthrough</text>

    <rect x="306" y="162" width="140" height="52" rx="8" fill="#101523" stroke="#2dd4a7" stroke-width="1.4"/>
    <text x="376" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#2dd4a7">tokens</text>
    <text x="376" y="202" text-anchor="middle" font-size="10" fill="#9aa2b5">usage or heuristic</text>

    <rect x="456" y="162" width="140" height="52" rx="8" fill="#101523" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="526" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#ffd08a">latency</text>
    <text x="526" y="202" text-anchor="middle" font-size="10" fill="#9aa2b5">TTFT · total · tok/s</text>

    <rect x="306" y="222" width="140" height="52" rx="8" fill="#101523" stroke="#f472b6" stroke-width="1.4"/>
    <text x="376" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#f9a8d4">energy</text>
    <text x="376" y="262" text-anchor="middle" font-size="10" fill="#9aa2b5">NVML watts · kWh · $</text>

    <rect x="456" y="222" width="140" height="52" rx="8" fill="#101523" stroke="#4ade80" stroke-width="1.4"/>
    <text x="526" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#4ade80">cloud-equiv $</text>
    <text x="526" y="262" text-anchor="middle" font-size="10" fill="#9aa2b5">reference price list</text>
  </g>

  <!-- upstream -->
  <g>
    <rect x="700" y="110" width="150" height="56" rx="10" fill="#151b29" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="775" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#c4b5fd">llama.cpp server</text>
    <text x="775" y="152" text-anchor="middle" font-size="11" fill="#9aa2b5">:8080/v1</text>
  </g>
  <g>
    <rect x="700" y="186" width="150" height="56" rx="10" fill="#151b29" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="775" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#c4b5fd">Ollama / LM Studio</text>
    <text x="775" y="228" text-anchor="middle" font-size="11" fill="#9aa2b5">:11434/v1 · :1234/v1</text>
  </g>

  <line x1="200" y1="138" x2="276" y2="160" stroke="#9fb4ff" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="200" y1="214" x2="276" y2="210" stroke="#9fb4ff" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="620" y1="150" x2="696" y2="138" stroke="#9fb4ff" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="620" y1="216" x2="696" y2="214" stroke="#9fb4ff" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- consumers row -->
  <g>
    <rect x="90" y="330" width="170" height="58" rx="10" fill="#151b29" stroke="#4f8cff" stroke-width="1.6"/>
    <text x="175" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#8fb4ff">dashboard</text>
    <text x="175" y="372" text-anchor="middle" font-size="11" fill="#9aa2b5">zero-dep, live SVG</text>
  </g>
  <g>
    <rect x="300" y="330" width="170" height="58" rx="10" fill="#151b29" stroke="#2dd4a7" stroke-width="1.6"/>
    <text x="385" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#2dd4a7">SQLite ledger</text>
    <text x="385" y="372" text-anchor="middle" font-size="11" fill="#9aa2b5">one row per request</text>
  </g>
  <g>
    <rect x="510" y="330" width="170" height="58" rx="10" fill="#151b29" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="595" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#ffd08a">reports + export</text>
    <text x="595" y="372" text-anchor="middle" font-size="11" fill="#9aa2b5">HTML · JSONL</text>
  </g>
  <g>
    <rect x="720" y="330" width="140" height="58" rx="10" fill="#151b29" stroke="#4ade80" stroke-width="1.6"/>
    <text x="790" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#4ade80">MCP server</text>
    <text x="790" y="372" text-anchor="middle" font-size="11" fill="#9aa2b5">agents read the ledger</text>
  </g>

  <line x1="450" y1="292" x2="175" y2="326" stroke="#39415a" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="450" y1="292" x2="385" y2="326" stroke="#39415a" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="450" y1="292" x2="595" y2="326" stroke="#39415a" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="450" y1="292" x2="790" y2="326" stroke="#39415a" stroke-width="1.5" marker-end="url(#arr3)"/>
</svg>
